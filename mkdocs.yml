site_name: The Man of The Gun
site_description: A dark, narrative-driven action game
site_author: MindShield Studios
site_url: https://tmotg.mindshield.ai

extra:
  meta:
    - name: 'google-site-verification'
      content: 'i7-uLw3KgNwO1WkIvmnSHWRmecGQGxSruRyE7Ws9sKs'

  favicon: 'favicon.ico'

theme:
  name: 'simple-blog'
  custom_dir: docs/overrides

nav:
  - Home: index.md
  - Story:
      - "Cold Open: The First Bruise": story/cold-open-the-first-bruise.md
      - "Prologue: Echoes of the Unseen": story/prologue-echoes-of-the-unseen.md
      - "Chapter 1: The Fractured Mirror": story/chapter-01-the-fractured-mirror.md
      - "Chapter 2: Threads of Reality": story/chapter-02-threads-of-reality.md
      - "Chapter 3: Shadows of Invy": story/chapter-03-shadows-of-invy.md
      - "Chapter 4: The Weight of Conviction": story/chapter-04-the-weight-of-conviction.md
      - "Chapter 5: Descent into the Abyss": story/chapter-05-descent-into-the-abyss.md
      - "Chapter 6: The Monolith": story/chapter-06-the-monolith.md
      - "Chapter 7: The Mathematician's Paradox": story/chapter-07-the-mathematicians-paradox.md
      - "Epilogue: The Table": story/epilogue-the-dining-philosophers.md
  - Characters: about/characters.md
  - Media:
      - Trailers: media/trailers.md
      - Gallery: media/gallery.md
      - Dev Updates: media/dev-updates.md
  - Contact: contact.md
  - Main Site: https://themanofthegun.com

plugins:
  - search
  - redirects:
      redirect_maps:
        about/story.md: story/cold-open-the-first-bruise.md
        about/echoes-of-the-unseen.md: story/prologue-echoes-of-the-unseen.md
        story/introduction.md: story/cold-open-the-first-bruise.md
        story/prologue.md: story/prologue-echoes-of-the-unseen.md

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: false
